<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShifoAI - Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --primary: #0284c7;
      --secondary: #0f766e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .balance-card {
      background: linear-gradient(135deg, #0284c7 0%, #0f766e 100%);
      color: white;
    }
    .balance-title { font-size: 14px; opacity: 0.9; }
    .balance-amount { font-size: 28px; font-weight: bold; margin-top: 8px; }
    .btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .doctor-item {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Balance Card -->
  <div class="card balance-card">
    <div class="balance-title">Bonus Balansingiz</div>
    <div class="balance-amount" id="user-balance">15 000 UZS</div>
  </div>

  <!-- Doctors Section -->
  <div class="card">
    <h3>Shifokorlar va Klinikalar</h3>
    <div id="doctors-list">
      <p style="color: #64748b;">Shifokorlar yuklanmoqda...</p>
    </div>
  </div>

  <button class="btn" onclick="bookAppointment()">Qabulga yozilish</button>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    // SUPABASE CONFIG (O'zingizning URL va KEY'ingizni joylang)
    const SUPABASE_URL = "https://lcyrrjbngcjpspyrbkfv.supabase.co"
    const SUPABASE_KEY ="sb_publishable_ZTcriy4OnRZTrpWSL-Dp7w_64D8RQSZ" ;

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadDoctors() {
      const { data: doctors, error } = await supabase.from('doctors').select('*');
      const listContainer = document.getElementById('doctors-list');
      
      if (error || !doctors || doctors.length === 0) {
        listContainer.innerHTML = `
          <div class="doctor-item">
            <strong>Dr. Alisher Ahmedov</strong><br>
            <small>Kardiolog • Akfa Medline</small><br>
            <span style="color: #0284c7;">Qabul: 150 000 UZS (10% Cashback)</span>
          </div>`;
        return;
      }

      listContainer.innerHTML = '';
      doctors.forEach(doc => {
        listContainer.innerHTML += `
          <div class="doctor-item">
            <strong>${doc.full_name}</strong><br>
            <small>${doc.specialty} • ${doc.clinic_name || 'Xususiy'}</small><br>
            <span style="color: #0284c7;">Qabul: ${doc.consultation_fee.toLocaleString()} UZS (${doc.cashback_percentage}% Cashback)</span>
          </div>`;
      });
    }

    function bookAppointment() {
      if (tg) {
        tg.showAlert("Qabulga yozilish so'rovingiz qabul qilindi!");
      } else {
        alert("Qabulga yozilish so'rovingiz qabul qilindi!");
      }
    }

    loadDoctors();
  </script>
</body>
</html>
